{% extends "base.html" %}

{% block title %}Login - Sistema EAN{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header text-center bg-primary text-white">
                <h4><i class="fas fa-sign-in-alt me-2"></i>Login</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt me-2"></i>Entrar
                        </button>
                    </div>
                </form>
                
                <hr>
                
                <div class="text-center">
                    <p class="mb-0">Não tem conta?</p>
                    <a href="{{ url_for('register') }}" class="btn btn-outline-secondary btn-sm">
                        <i class="fas fa-user-plus me-1"></i>Criar Conta
                    </a>
                </div>
            </div>
        </div>
        
        <div class="card mt-3">
            <div class="card-body">
                <h6 class="card-title">Acesso Administrativo</h6>
                <p class="card-text small text-muted">
                    Usuário: <strong>admin</strong><br>
                    Senha: <strong>admin</strong>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
